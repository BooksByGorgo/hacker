<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1540" height="610" viewBox="0 0 1540 610">
  <title>A terminal application, its shell, the prompt, and the cursor</title>
  <desc>An actual xterm capture on Linux. Bash displays its version above a customized student@lab:/tmp$ prompt and a blue block cursor. Vector arrows identify the four parts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1540" height="610" fill="white"/>
  <image x="64" y="142" width="1412" height="305" xlink:href="terminal-capture.png"/>
  <rect x="62" y="140" width="1416" height="309" rx="3" fill="none" stroke="#7c8793" stroke-width="2"/>
  <g fill="#172533" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold">
    <text x="64" y="68">Terminal application: xterm</text>
    <text x="870" y="68">Shell: Bash</text>
    <text x="64" y="548">Shell prompt</text>
    <text x="660" y="548">Cursor</text>
  </g>
  <g fill="none" stroke="#1565c0" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 115 86 L 115 132"/>
    <path d="M 875 88 L 875 165 L 548 165"/>
    <path d="M 228 510 L 228 306 L 228 279"/>
    <path d="M 712 510 L 712 293 L 474 293 L 474 278"/>
  </g>
  <g fill="#425363" font-family="DejaVu Sans, sans-serif" font-size="24">
    <text x="64" y="584">The shell is ready for a command.</text>
    <text x="660" y="584">Your next character appears here.</text>
  </g>
</svg>
